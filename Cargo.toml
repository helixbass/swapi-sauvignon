[workspace]
members = [
  "swapi-sauvignon",
  "xtask",
  "shared",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.100"
jiff = "0.2.16"
sqlx = { version = "0.8", features = [ "runtime-tokio", "tls-native-tls", "postgres" ] }
squalid = { git = "https://github.com/helixbass/squalid", rev = "1a43e5d" }
tokio = { version = "1.48.0", features = ["full"] }
