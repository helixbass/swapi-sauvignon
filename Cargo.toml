[workspace]
members = [
  "swapi-sauvignon",
  "xtask",
  "shared",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1.0.100"
chrono = "0.4.42"
jiff = "0.2.16"
jiff-sqlx = { version = "0.1.1", features = [ "postgres" ] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8", features = [ "runtime-tokio", "tls-native-tls", "postgres", "chrono" ] }
squalid = { git = "https://github.com/helixbass/squalid", rev = "1a43e5d" }
tokio = { version = "1.48.0", features = ["full"] }
